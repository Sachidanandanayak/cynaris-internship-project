name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Automated PHPUnit Testing Suite
  # ============================================================================
  test:
    name: Run Automated PHPUnit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel_basics

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, curl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('laravel_basics/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy Environment Configuration
        run: cp .env.example .env

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: laravel_basics/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Assets with Vite
        run: npm run build

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Create SQLite Database File
        run: touch database/database.sqlite

      - name: Run PHPUnit Test Suite
        run: php artisan test

  # ============================================================================
  # Job 2: Multi-Stage Docker Image Build Validation
  # ============================================================================
  docker-build:
    name: Build & Validate Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Laravel Docker Image (Validation)
        uses: docker/build-push-action@v6
        with:
          context: laravel_basics
          file: laravel_basics/Dockerfile
          push: false
          tags: cynaris-internship-project:test-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 3: Docker Hub Push (Deploy Artifact on Main)
  # ============================================================================
  docker-push:
    name: Publish Docker Image to Docker Hub
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: laravel_basics
          file: laravel_basics/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cynaris-internship-project:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cynaris-internship-project:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
